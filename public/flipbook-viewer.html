<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Infinite Bloom Flipbook Viewer</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <link rel="stylesheet" type="text/css" href="/style/style.css">
    <link rel="stylesheet" type="text/css" href="/style/hiSlider2.min.css">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #f0f0f0; /* Light gray background */
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Georgia', serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            overflow: hidden;
        }

        .header {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 20px rgba(0, 0, 0, 0.1);
            position: relative;
            z-index: 1000;
        }

        .logo-section {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .logo {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1.2rem;
            font-weight: bold;
        }

        .title-info h1 {
            font-size: 1.5rem;
            color: #2d3748;
            margin-bottom: 0.25rem;
        }

        .title-info p {
            font-size: 0.9rem;
            color: #718096;
        }

        .user-section {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .user-info {
            text-align: right;
        }

        .user-name {
            font-size: 0.9rem;
            font-weight: 600;
            color: #2d3748;
            margin-bottom: 0.25rem;
        }

        .user-email {
            font-size: 0.8rem;
            color: #718096;
        }

        .user-avatar {
            width: 36px;
            height: 36px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 0.9rem;
        }

        #flipbook-container {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f0f0f0; /* Light gray background */
        }

        #flipbook {
            width: 100%;
            height: 100%;
            max-width: 1000px; /* Max width for the flipbook itself */
            max-height: 700px; /* Max height for the flipbook itself */
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }

        @media (max-width: 768px) {
            .header {
                padding: 1rem;
                flex-direction: column;
                gap: 1rem;
            }

            .user-section {
                order: -1;
            }

            #flipbook {
                width: 95%;
                height: 70vh;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="logo-section">
            <div class="logo">∞</div>
            <div class="title-info">
                <h1>The Infinite Bloom</h1>
                <p>Evolving by Perspective • by Kismet Krystle</p>
            </div>
        </div>
        <div class="user-section">
            <div class="user-info">
                <div class="user-name" id="userName">Welcome</div>
                <div class="user-email" id="userEmail">reader@example.com</div>
            </div>
            <div class="user-avatar" id="userAvatar">U</div>
        </div>
    </div>

    <div id="flipbook-container">
        <div id="flipbook"></div>
    </div>

    <script src="/javascript/config.js"></script>
    <script src="/javascript/LoadingJS.js"></script>
    <script src="/javascript/deString.js"></script>
    <script src="/javascript/jquery-3.7.1.min.js"></script>
    <script src="/javascript/book.min.js"></script>
    <script src="/javascript/pageItems.min.js"></script>
    <script src="/javascript/main.min.js"></script>
    <script src="/javascript/flipHtml5.hiSlider2.min.js"></script>
    <script src="/files/pageEditor.js"></script>
    <script src="/files/textSvgConfig.js"></script>
    <script src="/slide_javascript/slideJS.js"></script>

    <script>
        let currentPageIndex = 0;
        const pages = document.querySelectorAll('.page');
        const totalPages = pages.length;
        
        // Load user information
        function loadUserInfo() {
            const userName = localStorage.getItem('infiniteBloomUserName') || 'Welcome Reader';
            const userEmail = localStorage.getItem('infiniteBloomEmail') || 'reader@example.com';
            
            document.getElementById('userName').textContent = userName;
            document.getElementById('userEmail').textContent = userEmail;
            
            // Set avatar to first letter of name
            const firstLetter = userName.charAt(0).toUpperCase();
            document.getElementById('userAvatar').textContent = firstLetter;
        }

        function updatePageDisplay() {
            pages.forEach((page, index) => {
                page.classList.toggle('active', index === currentPageIndex);
            });
            
            document.getElementById('currentPage').textContent = currentPageIndex + 1;
            document.getElementById('totalPages').textContent = totalPages;
            
            document.getElementById('prevBtn').disabled = currentPageIndex === 0;
            document.getElementById('nextBtn').disabled = currentPageIndex === totalPages - 1;
        }

        function nextPage() {
            if (currentPageIndex < totalPages - 1) {
                currentPageIndex++;
                updatePageDisplay();
            }
        }

        function previousPage() {
            if (currentPageIndex > 0) {
                currentPageIndex--;
                updatePageDisplay();
            }
        }

        // Keyboard navigation
        document.addEventListener('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === ' ') {
                e.preventDefault();
                nextPage();
            } else if (e.key === 'ArrowLeft') {
                e.preventDefault();
                previousPage();
            }
        });

        // Touch/swipe support for mobile
        let startX = 0;
        let endX = 0;

        document.addEventListener('touchstart', function(e) {
            startX = e.changedTouches[0].screenX;
        });

        document.addEventListener('touchend', function(e) {
            endX = e.changedTouches[0].screenX;
            handleSwipe();
        });

        function handleSwipe() {
            const swipeThreshold = 50;
            const diff = startX - endX;
            
            if (Math.abs(diff) > swipeThreshold) {
                if (diff > 0) {
                    nextPage(); // Swipe left = next page
                } else {
                    previousPage(); // Swipe right = previous page
                }
            }
        }

        // Initialize
        loadUserInfo();
        updatePageDisplay();

        $(document).ready(function () {
            // Initialize the flipbook
            $("#flipbook").flipBook({
                pdfUrl: "/files/shot.jpg", // Placeholder, replace with actual PDF or image sequence logic
                // Other flipbook options can go here
                // For example, to load images:
                // pages: [
                //   { src: "/files/page1.jpg", thumb: "/files/thumb1.jpg", title: "Page 1" },
                //   { src: "/files/page2.jpg", thumb: "/files/thumb2.jpg", title: "Page 2" },
                // ],
                // Or if using a single image for demo:
                pages: [{ src: "/files/shot.jpg", thumb: "/files/shot.jpg", title: "Demo Page" }],
                // You might need to adjust paths and configuration based on your actual flipbook library setup
            });
        });
    </script>
</body>
</html>
